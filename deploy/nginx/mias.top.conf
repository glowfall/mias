server {
    listen 80;
    listen [::]:80;
    server_name mias.top www.mias.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.mias.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mias.top;

    ssl_certificate /etc/letsencrypt/live/mias.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mias.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://www.mias.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mias.top;

    ssl_certificate /etc/letsencrypt/live/mias.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mias.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
